<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Radio - Listen Live</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎉 Funky German Radio 🇩🇪</h1>
            <p>Feel the vibe! Listen to the best German stations live</p>
        </header>

        <div class="player">
            <div class="album-art">
                <div class="album-placeholder">
                    <i class="fas fa-compact-disc disc-icon"></i>
                </div>
            </div>

            <!-- Equalizer Animation bars -->
            <div class="visualizer" id="equalizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>

            <div class="song-info">
                <h2 id="station-name">Select a Station</h2>
                <p id="song-title">Ready to Jam! ⚡</p>
            </div>

            <div class="controls">
                <button id="prev-btn" class="control-btn" title="Previous Station">
                    <i class="fas fa-backward"></i>
                </button>

                <button id="play-pause-btn" class="play-pause-btn" title="Play/Pause">
                    <i class="fas fa-play"></i>
                </button>

                <button id="next-btn" class="control-btn" title="Next Station">
                    <i class="fas fa-forward"></i>
                </button>
            </div>

            <div class="volume-control">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
                <i class="fas fa-volume-up"></i>
            </div>

            <audio id="audio-player"></audio>
        </div>

        <div class="stations-section">
            <h2>✨ Pick Your Vibe</h2>
            <div id="stations-list" class="stations-list"></div>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p class="made-by">
                    ✨ Made with 💛 by <strong>Mohamed Gandoul</strong>
                </p>
                <p class="nickname">
                    Nickname: <strong>@Pepo</strong>
                </p>
                <p class="fun-fact">
                    🎯 Fun Fact: I built this radio player while listening to 🎵 1LIVE!
                </p>
                <p class="copyright">
                    DE German Radio © 2026 | Casablanca, Morocco
                </p>
            </div>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>

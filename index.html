<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Knowledge Radio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📚 German Knowledge Radio</h1>
            <p>Learn, listen, and stay informed with premium educational & news stations</p>
        </header>

        <div class="player">
            <div class="song-info">
                <h2 id="station-name">Select a Station</h2>
                <p id="song-title">Ready to stream knowledge 🎧</p>
            </div>

            <div class="controls">
                <button id="prev-btn" class="control-btn" title="Previous"><i class="fas fa-backward"></i></button>
                <button id="play-pause-btn" class="play-pause-btn" title="Play/Pause"><i class="fas fa-play"></i></button>
                <button id="next-btn" class="control-btn" title="Next"><i class="fas fa-forward"></i></button>
            </div>

            <div class="volume-control">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
                <i class="fas fa-volume-up"></i>
            </div>

            <audio id="audio-player"></audio>
        </div>

        <div class="stations-section">
            <h2>📖 Info & Educational Channels</h2>
            <div id="stations-list" class="stations-list"></div>
        </div>

        <footer class="footer">
            <div class="footer-content">
                <p>✨ Made with 💛 by <strong>Mohamed Gandoul</strong> (@Pepo)</p>
                <p class="copyright">DE German Radio © 2026 | Casablanca, Morocco</p>
            </div>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
